[project]
name = "dlt-dbt-motherduck-project"
version = "0.1.0"
description = "Minimal end-to-end MotherDuck pipeline reference using dlt and dbt."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-duckdb==1.10.1",
    "dlt[motherduck]==1.24.0",
    "duckdb==1.5.1",
]

[tool.uv]
package = false
# Security floors for transitive dependencies; do not bypass upstream constraints.
constraint-dependencies = [
    "click>=8.3.3",
    "gitpython>=3.1.59",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "setuptools>=83.0.0",
    "sqlparse>=0.6.0",
    "urllib3>=2.7.0",
]

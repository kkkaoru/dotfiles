[build]
# Keep test/debug artifacts out of the checkout. macOS periodically cleans /tmp,
# and CARGO_TARGET_DIR can override this for a persistent cache when needed.
target-dir = "/tmp/claudex-agent-adapter-target"

[alias]
fmt-check = "fmt --all -- --check"
test-all = "test --all-targets"
lint = "clippy --all-targets --all-features -- -D warnings -D clippy::excessive_nesting -D clippy::cognitive_complexity"
coverage = "run --bin coverage-branch"
coverage-branch = "run --bin coverage-branch"

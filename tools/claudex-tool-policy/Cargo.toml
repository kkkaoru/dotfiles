[package]
name = "claudex-tool-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Claude Code hook: claudex main-session tool denials and SubAgent file locks"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tempfile = "3.0"

[dev-dependencies]
libc = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
cognitive_complexity = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
needless_raw_string_hashes = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
todo = "deny"
too_many_lines = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1

[package]
name = "claudex-route-usage"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.0"
url = "2.5"
wait-timeout = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
cognitive_complexity = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
needless_raw_string_hashes = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
todo = "deny"
too_many_lines = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
